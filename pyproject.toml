[project]
name = "gatekeeper"
version = "0.1.0"
description = "Gatekeeper: a trading desk dashboard on top of the day-trader skills. Every trade has to earn its way in."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "streamlit>=1.40",
  "plotly>=5.24",
  "pandas>=2.2",
  "pydantic>=2.8",
  "pydantic-settings>=2.7",
  "apscheduler>=3.10,<4",
  "sqlmodel>=0.0.22",
  "httpx>=0.27",
  "filelock>=3.15",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
notify = ["win11toast>=0.35"]
broker = ["alpaca-py>=0.30"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "freezegun>=1.5",
    "ruff>=0.6",
    "pytest-timeout>=2.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gatekeeper", "worker", "app"]

[tool.ruff]
line-length = 110
extend-exclude = ["vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
